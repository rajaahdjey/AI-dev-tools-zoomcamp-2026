<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New chore</title>
</head>
<body>
  <h1>New chore</h1>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{% url 'chore_create' %}">
    {% csrf_token %}
    <label for="id_title">Title</label>
    <input id="id_title" name="title" maxlength="120" required value="{{ title|default:'' }}">
    <label for="id_notes">Notes</label>
    <textarea id="id_notes" name="notes">{{ notes|default:'' }}</textarea>
    <label for="id_assignee">Assignee</label>
    <select id="id_assignee" name="assignee" required>
      <option value="">— pick —</option>
      {% for r in roommates %}
      <option value="{{ r.id }}" {% if r.id|stringformat:"s" == assignee_filter %}selected{% endif %}>{{ r.name }}</option>
      {% endfor %}
    </select>
    <label for="id_due_date">Due date (optional)</label>
    <input id="id_due_date" type="date" name="due_date" value="{{ due_date|default:'' }}">
    <button type="submit">Create</button>
  </form>
  <p><a href="{% url 'chore_list' %}">Back</a></p>
</body>
</html>
